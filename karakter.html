<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pilih Karakter — Dam-Daman</title>
  <style>
    /* Basic Cover-like theme (glassmorphism + neon) */
    :root{--bg1:#1a1a2e;--bg2:#16213e;--bg3:#0f3460;--accent-red:#ff6b6b;--accent-blue:#4ecdc4}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);color:#fff}
    .card{width:92%;max-width:1100px;background:rgba(255,255,255,0.04);backdrop-filter:blur(10px);border-radius:18px;padding:28px;display:grid;grid-template-columns:1fr 140px 1fr;gap:18px;align-items:center;border:1px solid rgba(255,255,255,0.06)}
    .column{display:flex;flex-direction:column;gap:16px;align-items:center}
    .preview{width:220px;height:220px;border-radius:50%;background:#fff2;display:flex;align-items:center;justify-content:center;overflow:hidden;border:6px solid rgba(255,255,255,0.08)}
    .preview img{width:100%;height:100%;object-fit:contain}
    .name-input{width:220px;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.25);color:#fff}
    .label{font-size:14px;opacity:0.9}
    .avatar-strip{display:flex;gap:10px;overflow-x:auto;padding:8px 6px;width:100%;-webkit-overflow-scrolling:touch}
    .avatar-thumb{width:64px;height:64px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.03);cursor:pointer;border:2px solid transparent}
    .avatar-thumb img{width:90%;height:90%;object-fit:contain}
    .avatar-thumb.selected{transform:scale(1.06);box-shadow:0 10px 25px rgba(0,0,0,0.6);border-color:rgba(8, 99, 15, 0.12)}
    /* Glow RED */
    .avatar-thumb.selected.red-glow {
      border-color: #ff2b2b;
      box-shadow: 0 0 10px #ff2b2b, 0 0 25px #ff2b2b, 0 0 50px rgba(255,0,0,0.8);
      animation: pulseRed 1s infinite alternate ease-in-out;
    }

    /* Glow BLUE */
    .avatar-thumb.selected.blue-glow {
      border-color: #00c3ff;
      box-shadow: 0 0 10px #00c3ff, 0 0 25px #00c3ff, 0 0 50px rgba(0,195,255,0.8);
      animation: pulseBlue 1s infinite alternate ease-in-out;
    }

    @keyframes pulseRed {
      0% { transform:scale(1.02); }
      100% { transform:scale(1.12); }
    }

    @keyframes pulseBlue {
      0% { transform:scale(1.02); }
      100% { transform:scale(1.12); }
    }


    .vs-col{display:flex;flex-direction:column;align-items:center;gap:8px}
    .vs-text{font-weight:900;font-size:48px;color:#fff;letter-spacing:2px;text-shadow:0 6px 30px rgba(255,0,80,0.06)}
    .continue-btn{padding:12px 20px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--accent-red),#e86a5a);color:#fff;font-weight:700;cursor:pointer}
    .continue-row{display:flex;gap:12px;flex-direction:column;align-items:center}
    .hint{font-size:13px;opacity:0.8}
    .close-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s ease-in-out;
      backdrop-filter: blur(4px);
    }

    .close-btn:hover {
      background: rgba(255,0,80,0.55);
      transform: scale(1.15) rotate(7deg);
    }
    .popup-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(5px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.popup-box {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(12px);
    padding: 25px;
    width: 340px;
    text-align: center;
    border-radius: 20px;
    animation: popupIn .25s ease-out;
    position: relative;
}

@keyframes popupIn {
    from { transform: scale(.6); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
}

.popup-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    color: white;
    font-size: 16px;
    margin-bottom: 12px;
}

.popup-btn.red {
    background: linear-gradient(135deg, #ff4949, #d62828);
}

.popup-btn.green {
    background: linear-gradient(135deg, #2ecc71, #27ae60);
}

.popup-btn:hover {
    transform: scale(1.05);
}

.popup-close {
    position: absolute;
    top: 10px; right: 14px;
    font-size: 26px;
    cursor: pointer;
    font-weight: bold;
}


    
    
    /* responsive */
    @media (max-width:880px){.card{grid-template-columns:1fr;grid-auto-rows:auto;padding:18px}.preview{width:160px;height:160px}.name-input{width:160px}}
  </style>
</head>
<body>
  <!-- AUDIO -->
  <audio id="clickSound" src="Aset/click.wav" preload="auto"></audio>
  <audio id="bgMusic" src="Aset/backsound.mp3" loop preload="auto"></audio>

  <div class="card" id="characterCard">
    <!-- Close Button -->
    <div class="close-btn" id="closeBtn">×</div>

    <!-- Pemain Merah -->
    <div class="column" id="redColumn">
      <div class="label">Pemain Merah</div>
      <div class="preview" id="redPreview"><img src="Aset/avatars/red1.png" alt="Red preview" id="redPreviewImg"></div>
      <input class="name-input" id="redName" placeholder="Masukkan nama pemain merah" maxlength="18">
      <div class="avatar-strip" id="redStrip"></div>
    </div>

    <!-- VS -->
    <div class="vs-col">
      <div class="vs-text">VS</div>
      <div class="continue-row">
        <div class="hint" id="modeHint">Mode: —</div>
        <button class="continue-btn" id="continueBtn">Lanjutkan</button>
      </div>
    </div>

    <!-- Pemain Biru -->
    <div class="column" id="blueColumn">
      <div class="label">Pemain Biru</div>
      <div class="preview" id="bluePreview"><img src="Aset/avatars/blue1.png" alt="Blue preview" id="bluePreviewImg"></div>
      <input class="name-input" id="blueName" placeholder="Masukkan nama pemain biru" maxlength="18">
      <div class="avatar-strip" id="blueStrip"></div>
    </div>
  </div>

  <div id="modePopup" class="popup-overlay">
    <div class="popup-box">
        <h2>Pilih Mode Permainan</h2>
       
        <button class="popup-btn red" onclick="startGame('challenge')">
            Challenge
        </button>

        <button class="popup-btn green" onclick="startGame('classic')">
            Klasik
        </button>

        <div class="close-btn" onclick="closePopup()">×</div>
    </div>
</div>
  
<script>
  // Configuration
  const MAX_AVATARS = 6;
  const redAvatars = Array.from({length:MAX_AVATARS},(_,i)=>`Aset/avatars/red${i+1}.png`);
  const blueAvatars = Array.from({length:MAX_AVATARS},(_,i)=>`Aset/avatars/blue${i+1}.png`);

  // Elements
  const redStrip = document.getElementById('redStrip');
  const blueStrip = document.getElementById('blueStrip');
  const redPreviewImg = document.getElementById('redPreviewImg');
  const bluePreviewImg = document.getElementById('bluePreviewImg');
  const redName = document.getElementById('redName');
  const blueName = document.getElementById('blueName');
  const continueBtn = document.getElementById('continueBtn');
  const modeHint = document.getElementById('modeHint');
  const clickSound = document.getElementById("clickSound");
  const bgMusic = document.getElementById("bgMusic");
  
  let selectedRed = 0; 
  let selectedBlue = 0;

  // --- PERBAIKAN DI SINI ---
  // 1. Ambil Tipe Lawan (Single/Multi) dari URL
  const urlParams = new URLSearchParams(window.location.search);
  // Kita namakan 'opponentType' agar tidak bentrok dengan mode permainan nanti
  const opponentType = urlParams.get('mode') || 'multi'; 
  
  modeHint.textContent = `Mode: ${opponentType === 'single' ? 'Single Player (vs AI)' : 'Multiplayer'}`;


  // ======================================
  // CORE FUNCTIONS 
  // ======================================

  function updateStripSelection(side){
    const strip = side==='red' ? redStrip : blueStrip;
    const children = Array.from(strip.children);
    children.forEach((c,idx)=>{
      c.classList.remove("red-glow","blue-glow");
      c.classList.toggle("selected",(side==='red'?selectedRed:selectedBlue)===idx);

      if(c.classList.contains("selected")){
          c.classList.add(side==='red' ? "red-glow" : "blue-glow");
      }
    });
  }

  function selectAvatar(side,index){
    if(side==='red'){
      selectedRed = index;
      redPreviewImg.src = redAvatars[index];
      updateStripSelection('red');
    } else {
      selectedBlue = index;
      bluePreviewImg.src = blueAvatars[index];
      updateStripSelection('blue');
    }
  }
  
  function makeThumb(src, idx, side){
    const el = document.createElement('div');
    el.className = 'avatar-thumb';
    el.tabIndex = 0;
    const img = document.createElement('img'); img.src = src; img.alt = `${side} avatar ${idx+1}`;
    el.appendChild(img);
    return el;
  }
  
  function addSoundEffectToThumb(el){
      el.addEventListener("click", () => {
        clickSound.currentTime = 0;
        clickSound.play();
    });
  }

  function closePopup() {
      document.getElementById("modePopup").style.display = "none";
  }


  // ======================================
  // 1. Logic Penyesuaian Mode (Gunakan opponentType)
  // ======================================
  if (opponentType === 'single') {
      // Mode Single Player
      blueName.value = 'Komputer';
      blueName.readOnly = true; 
      blueName.style.opacity = '0.7';
      blueName.style.cursor = 'default';

      const randomBlueIndex = Math.floor(Math.random() * MAX_AVATARS);
      selectedBlue = randomBlueIndex;
      bluePreviewImg.src = blueAvatars[randomBlueIndex]; 

      blueStrip.style.display = 'none';
      
  } else {
      // Mode Multiplayer
      blueName.value = '';
      blueName.readOnly = false;
      blueName.style.opacity = '1';
  }


  // ======================================
  // 2. Populate Thumbnails 
  // ======================================
  
  redAvatars.forEach((src,i)=>{
    const thumb = makeThumb(src,i,'red');
    addSoundEffectToThumb(thumb);
    thumb.addEventListener('click', ()=>selectAvatar('red',i));
    redStrip.appendChild(thumb);
  });

  // Populate BLUE hanya jika MULTIPLAYER
  if (opponentType !== 'single') {
      blueAvatars.forEach((src,i)=>{
          const thumb = makeThumb(src,i,'blue');
          addSoundEffectToThumb(thumb);
          thumb.addEventListener('click', ()=>selectAvatar('blue',i));
          blueStrip.appendChild(thumb);
      });
  }
  
  selectAvatar('red', selectedRed);
  selectAvatar('blue', selectedBlue);


  // ======================================
  // 3. Event Listeners & START GAME
  // ======================================
  
  continueBtn.addEventListener("click", () => {
      clickSound.currentTime = 0;
      clickSound.play();
      document.getElementById("modePopup").style.display = "flex";
  });

  document.querySelectorAll('.avatar-strip').forEach(strip=>{
    strip.addEventListener('wheel', (e)=>{
      e.preventDefault();
      strip.scrollLeft += e.deltaY;
    });
  });

  // --- PERBAIKAN UTAMA DI SINI ---
  function startGame(selectedRule) { 
      // selectedRule berisi 'classic' atau 'challenge' (dari tombol popup)
      
      // Ambil nama pemain
      const rName = encodeURIComponent((redName.value || 'Merah').trim());
      const bNameDefault = (opponentType === 'single') ? 'Komputer' : 'Biru';
      const bName = encodeURIComponent((blueName.value || bNameDefault).trim());

      // Ambil avatar pemain
      const rAvatar = encodeURIComponent(redAvatars[selectedRed]);
      const bAvatar = encodeURIComponent(blueAvatars[selectedBlue]);

      // KITA KIRIM DUA PARAMETER:
      // 1. mode = Aturan Main (Classic/Challenge)
      // 2. type = Tipe Lawan (Single/Multi) -> Ini yang sebelumnya hilang
      const target = `coba.html?mode=${selectedRule}&type=${opponentType}&rName=${rName}&bName=${bName}&rAvatar=${rAvatar}&bAvatar=${bAvatar}`;

      window.location.href = target;
  }

  document.getElementById("closeBtn").addEventListener("click", () => {
    clickSound.currentTime = 0;
    clickSound.play();
    window.location.href = "index.html";
  });

  document.body.addEventListener("click", () => {
    bgMusic.volume = 0.7;
    bgMusic.play().catch(e => console.log("Autoplay blocked"));
  }, { once:true });

</script>

  </body>
</html>
